<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор дози опромінення після аварії на атомній електростанції</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f6fa;
    }
    h1 {
      text-align: center;
      color: #2f3640;
    }
    label, button, select, input {
      font-size: 16px;
      margin: 5px 0;
    }
    input, select {
      padding: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f0f0f0;
    }
    canvas {
      display: block;
      margin: 0 auto;
      max-width: 600px;
      height: 400px !important;
    }
  </style>
</head>
<body>
  <h1>Калькулятор дози після аварії на атомній електростанції</h1><label>Потужність дози на місцевості (мЗв/год):</label><br> <input type="number" id="Pt" step="0.001"><br>

<label>Час вимірювання Pt після аварії (годин):</label><br> <input type="number" id="t" step="0.1"><br>

<label>Початок опромінення після аварії (годин):</label><br> <input type="number" id="Ta" step="0.1"><br>

<label>Кінець опромінення після аварії (годин):</label><br> <input type="number" id="Tb" step="0.1"><br>

<label>Коефіцієнт захисту:</label><br> <select id="Kz"> <option value="1">1</option> <option value="2">2</option> <option value="4">4</option> <option value="10">10</option> <option value="50">50</option> <option value="100">100</option> <option value="500">500</option> </select><br>

<button onclick="calculateDose()">Розрахувати дозу</button> <button onclick="exportToExcel()">Зберегти в Excel (CSV)</button> <button onclick="copyResults()">Копіювати результат</button>

  <h2>Результати</h2>
  <p id="results"></p>  <h3>Графік зменшення потужності дози</h3>
  <canvas id="doseChart"></canvas>  <h3>Таблиця розрахунків</h3>
  <table id="doseTable">
    <thead>
      <tr>
        <th>Час (год)</th>
        <th>Потужність на початку інтервалу (мЗв/год)</th>
        <th>Доза за інтервал (мЗв)</th>
        <th>Накопичена доза (мЗв)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>  <script>
    function calculateDose() {
      const Pt = parseFloat(document.getElementById('Pt').value);
      const t = parseFloat(document.getElementById('t').value);
      const Ta = parseFloat(document.getElementById('Ta').value);
      const Tb = parseFloat(document.getElementById('Tb').value);
      const Kz = parseFloat(document.getElementById('Kz').value);

      if (isNaN(Pt) || isNaN(t) || isNaN(Ta) || isNaN(Tb) || isNaN(Kz)) {
        alert('Будь ласка, заповніть усі поля.');
        return;
      }

      // Формула для P1 (через 1 годину після аварії)
      const P1 = Pt * Math.pow(t, 0.4);

      // Формула для дози D = 5 * P1 * (Ta^-0.4 - Tb^-0.4) / Kz
      const D = 5 * P1 * (Math.pow(Ta, -0.4) - Math.pow(Tb, -0.4)) / Kz;

      document.getElementById('results').innerHTML = `
        <b>P1 (через 1 годину після аварії):</b> ${P1.toFixed(3)} мЗв/год<br>
        <b>D (доза від Ta до Tb):</b> ${D.toFixed(3)} мЗв
      `;

      // Таблиця і графік
      const tableBody = document.querySelector('#doseTable tbody');
      tableBody.innerHTML = '';
      const step = 1;
      let cumulative = 0;
      const dataPoints = [];

      for (let hour = Ta; hour <= Tb; hour += step) {
        const Pstart = P1 * Math.pow(hour, -0.4);
        const Dinterval = 5 * P1 * (Math.pow(hour, -0.4) - Math.pow(hour + step, -0.4)) / Kz;
        cumulative += Dinterval;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${hour.toFixed(0)}</td>
          <td>${Pstart.toFixed(3)}</td>
          <td>${Dinterval.toFixed(3)}</td>
          <td>${cumulative.toFixed(3)}</td>
        `;
        tableBody.appendChild(row);

        dataPoints.push({ x: hour, y: Pstart });
      }

      // Графік
      const ctx = document.getElementById('doseChart').getContext('2d');
      if (window.doseChart) window.doseChart.destroy();
      window.doseChart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Потужність дози (мЗв/год)',
            data: dataPoints,
            borderColor: 'blue',
            borderWidth: 2,
            fill: false,
            pointRadius: 4,
            pointBackgroundColor: 'red'
          }]
        },
        options: {
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'Час після аварії (год)' },
              ticks: {
                stepSize: 1,
                callback: function(value) { return value.toFixed(0); }
              }
            },
            y: {
              title: { display: true, text: 'Потужність дози (мЗв/год)' }
            }
          }
        }
      });
    }

    function exportToExcel() {
      const wb = XLSX.utils.table_to_book(document.getElementById('doseTable'), { sheet: 'Дані' });
      XLSX.writeFile(wb, 'результати_дози_АЕС.xlsx');
    }

    function copyResults() {
      const text = document.getElementById('results').innerText;
      navigator.clipboard.writeText(text);
      alert('Результат скопійовано!');
    }
  </script></body>
</html>
